<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>노트북 추천</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>노트북 사양 추천</h1>
        <div class="question-section">
            <p>1. 동시에 몇 개나 띄워놓고 쓰시나요?</p>
            <div class="radio-group">
                <input type="radio" id="apps1_3" name="simultaneous_apps" value="low" checked>
                <label for="apps1_3">1~3개 (간단한 작업)</label>
                <input type="radio" id="apps4_7" name="simultaneous_apps" value="medium">
                <label for="apps4_7">4~7개 (멀티태스킹)</label>
                <input type="radio" id="apps8_plus" name="simultaneous_apps" value="high">
                <label for="apps8_plus">8개 이상 (전문 작업)</label>
            </div>
        </div>

        <div class="question-section">
            <p>2. 주로 어떤 앱/프로그램을 사용하시나요? (예: MS워드, 포토샵, 롤, 유튜브, 캐드)</p>
            <input type="text" id="mainApps" placeholder="여러 개라면 쉼표로 구분해서 입력해주세요.">
        </div>

        <div class="question-section">
            <p>3. 이 노트북을 몇 년 정도 사용할 예정이신가요?</p>
            <div class="radio-group">
                <input type="radio" id="years1_2" name="usage_years" value="short" checked>
                <label for="years1_2">1~2년</label>
                <input type="radio" id="years3_4" name="usage_years" value="medium">
                <label for="years3_4">3~4년</label>
                <input type="radio" id="years5_plus" name="usage_years" value="long">
                <label for="years5_plus">5년 이상</label>
            </div>
        </div>

        <div class="question-section">
            <p>4. 자주 하는 게임이 있으신가요? (고사양 게임 여부)</p>
            <input type="text" id="favoriteGame" placeholder="리그오브레전드, 오버워치, 배틀그라운드 등">
        </div>

        <div class="question-section">
            <p>5. 화상 회의나 온라인 강의 비중이 높은가요?</p>
            <div class="radio-group">
                <input type="radio" id="videoConfYes" name="video_conference" value="yes" checked>
                <label for="videoConfYes">예</label>
                <input type="radio" id="videoConfNo" name="video_conference" value="no">
                <label for="videoConfNo">아니오</label>
            </div>
        </div>

        <div class="question-section">
            <p>6. 파일은 주로 어디에 저장하시나요? (클라우드, 노트북 자체, 외장하드)</p>
            <input type="text" id="fileStorage" placeholder="구글 드라이브, OneDrive, 노트북 저장 등">
        </div>

        <div class="question-section">
            <p>7. 화면 터치나 펜 기능이 필요하신가요?</p>
            <div class="radio-group">
                <input type="radio" id="touchPenYes" name="touch_pen" value="yes" checked>
                <label for="touchPenYes">예</label>
                <input type="radio" id="touchPenNo" name="touch_pen" value="no">
                <label for="touchPenNo">아니오</label>
            </div>
        </div>

        <button id="recommendBtn">추천받기</button>
        <div id="result" class="result-box" style="display: none;">
            <h2>추천 사양</h2>
            <p><strong>CPU:</strong> <span id="cpuResult"></span></p>
            <p><strong>RAM:</strong> <span id="ramResult"></span></p>
        </div>
    </div>
    <script>
        const recommendBtn = document.getElementById('recommendBtn');
        const resultDiv = document.getElementById('result');
        const cpuResult = document.getElementById('cpuResult');
        const ramResult = document.getElementById('ramResult');

        // Define recommendation tiers
        const cpuTiers = [
            "Intel Core i3 / AMD Ryzen 3 (기본 웹 서핑, 문서 작업)",
            "Intel Core i5 / AMD Ryzen 5 (일상적인 멀티태스킹, 가벼운 게임)",
            "Intel Core i7 / AMD Ryzen 7 (고사양 멀티태스킹, 전문 작업, 중간 게임)",
            "Intel Core i9 / AMD Ryzen 9 (최고 사양 전문 작업, 고사양 게임, 영상 편집)"
        ];

        const ramTiers = [
            "8GB (기본 웹 서핑, 문서 작업)",
            "16GB (멀티태스킹, 대부분의 전문 작업, 게임)",
            "32GB 이상 (고사양 전문 작업, 영상 편집, 고사양 게임)"
        ];

        recommendBtn.addEventListener('click', () => {
            let cpuScore = 0;
            let ramScore = 0;

            // 1. 동시에 몇 개나 띄워놓고 쓰시나요?
            const simultaneousApps = document.querySelector('input[name="simultaneous_apps"]:checked').value;
            if (simultaneousApps === 'medium') {
                cpuScore += 1;
                ramScore += 1;
            } else if (simultaneousApps === 'high') {
                cpuScore += 2;
                ramScore += 2;
            }

            // 2. 주로 어떤 앱/프로그램을 사용하시나요?
            const mainApps = document.getElementById('mainApps').value.toLowerCase();
            if (mainApps.includes('캐드') || mainApps.includes('cad') || mainApps.includes('영상 편집') || mainApps.includes('3d') || mainApps.includes('렌더링')) {
                cpuScore += 3;
                ramScore += 3;
            } else if (mainApps.includes('포토샵') || mainApps.includes('일러스트') || mainApps.includes('디자인') || mainApps.includes('프로그래밍') || mainApps.includes('코딩')) {
                cpuScore += 2;
                ramScore += 2;
            } else if (mainApps.includes('ms워드') || mainApps.includes('엑셀') || mainApps.includes('파워포인트') || mainApps.includes('한글')) {
                cpuScore += 0; // Basic apps don't significantly increase score
            }

            // 3. 이 노트북을 몇 년 정도 사용할 예정이신가요?
            const usageYears = document.querySelector('input[name="usage_years"]:checked').value;
            if (usageYears === 'medium') {
                cpuScore += 1;
                ramScore += 1;
            } else if (usageYears === 'long') {
                cpuScore += 2;
                ramScore += 2;
            }

            // 4. 자주 하는 게임이 있으신가요?
            const favoriteGame = document.getElementById('favoriteGame').value.toLowerCase();
            if (favoriteGame.includes('배틀그라운드') || favoriteGame.includes('사이버펑크') || favoriteGame.includes('위쳐') || favoriteGame.includes('스타필드') || favoriteGame.includes('레드 데드 리뎀션')) {
                cpuScore += 3; // High-end games
                ramScore += 2;
            } else if (favoriteGame.includes('오버워치') || favoriteGame.includes('에이펙스 레전드') || favoriteGame.includes('발로란트') || favoriteGame.includes('원신')) {
                cpuScore += 2; // Medium-high games
                ramScore += 1;
            } else if (favoriteGame.includes('리그오브레전드') || favoriteGame.includes('롤') || favoriteGame.includes('메이플스토리') || favoriteGame.includes('서든어택')) {
                cpuScore += 1; // Low-medium games
            }

            // 5. 화상 회의나 온라인 강의 비중이 높은가요?
            const videoConference = document.querySelector('input[name="video_conference"]:checked').value;
            if (videoConference === 'yes') {
                ramScore += 0.5; // Slightly increased RAM for stable video calls
            }

            // 6. 파일은 주로 어디에 저장하시나요? - This question is more for storage (SSD size), not directly CPU/RAM.
            //    I'll ignore it for CPU/RAM recommendation for now, as the request was only for CPU/RAM.

            // 7. 화면 터치나 펜 기능이 필요하신가요? - This is a feature, not CPU/RAM related.
            //    I'll ignore it for CPU/RAM recommendation.

            // Determine CPU tier
            let recommendedCpuIndex = 0;
            if (cpuScore >= 7) {
                recommendedCpuIndex = 3; // i9/Ryzen 9
            } else if (cpuScore >= 4) {
                recommendedCpuIndex = 2; // i7/Ryzen 7
            } else if (cpuScore >= 1) {
                recommendedCpuIndex = 1; // i5/Ryzen 5
            }
            // Ensure index is within bounds
            recommendedCpuIndex = Math.min(recommendedCpuIndex, cpuTiers.length - 1);

            // Determine RAM tier
            let recommendedRamIndex = 0;
            if (ramScore >= 5) {
                recommendedRamIndex = 2; // 32GB+
            } else if (ramScore >= 2) {
                recommendedRamIndex = 1; // 16GB
            }
            // Ensure index is within bounds
            recommendedRamIndex = Math.min(recommendedRamIndex, ramTiers.length - 1);

            cpuResult.textContent = cpuTiers[recommendedCpuIndex];
            ramResult.textContent = ramTiers[recommendedRamIndex];
            resultDiv.style.display = 'block';
        });
    </script>

</body>
</html>
