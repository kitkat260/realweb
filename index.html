<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>노트북 추천 설문</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5100671380810488"
     crossorigin="anonymous"></script>
    <meta name="google-adsense-account" content="ca-pub-5100671380810488">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="container bg-white rounded-2xl shadow-xl p-8 md:p-12 mx-4 w-full max-w-2xl">
        
        <div id="main-content">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-800 text-center mb-2">노트북 추천 설문</h1>
            <p id="main-description" class="text-gray-500 text-center mb-8">당신에게 딱 맞는 노트북을 찾아드립니다!</p>
            
            <!-- Progress Bar -->
            <div id="progress-container" class="w-full bg-gray-200 rounded-full h-2.5 mb-8" style="display: none;">
                <div id="progressBar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-500 ease-out"></div>
            </div>

            <div id="quiz-area">
                <!-- Steps will be injected here by JS -->
            </div>
        </div>

        <div id="result-area" class="text-center" style="display: none;">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">설문이 완료되었습니다!</h2>
            <p class="text-gray-600 mb-6">결과는 브라우저의 개발자 콘솔(F12)에서 확인하실 수 있습니다.</p>
            <button id="startOverBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300">다시 시작하기</button>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const quizArea = document.getElementById('quiz-area');
            const resultArea = document.getElementById('result-area');
            const startOverBtn = document.getElementById('startOverBtn');
            const progressBar = document.getElementById('progressBar');
            const progressContainer = document.getElementById('progress-container');

            const questions = [
                {
                    id: 'major_job',
                    q: '본인의 전공(혹은 직업)은 무엇인가요?',
                    options: { 'humanities': '인문/사회/경영', 'engineering': '공학(IT)', 'design_art': '디자인/예술', 'natural_science': '자연과학', 'arts_music_pe': '예체능' }
                },
                {
                    id: 'main_apps',
                    q: '주로 어떤 앱(프로그램)을 실행할 계획인가요?',
                    options: { 'documents': '단순 문서(워드/PPT)', 'coding': '전문 코딩', 'photo_video': '사진/영상 편집', '3d_design': '3D 설계' }
                },
                {
                    id: 'gaming_frequency',
                    q: '평소에 자주 즐기는 게임이 있나요?',
                    options: { 'none': '안 함', 'low_spec': '저사양(롤/메이플)', 'mid_spec': '중사양(오버워치/FC)', 'high_spec': '고사양(배그/AAA게임)' }
                },
                {
                    id: 'usage_location',
                    q: '노트북을 주로 어디서 사용하실 예정인가요?',
                    options: { 'desk': '집에 두고 사용 (무게 상관없음)', 'mobile': '자주 들고 이동 (가벼운 무게 필수)' }
                },
                {
                    id: 'battery_importance',
                    q: '외부에서 어댑터 없이 사용하는 시간이 긴가요?',
                    options: { 'yes': '네, 배터리가 아주 중요해요', 'no': '아니요, 항상 충전기를 꽂고 써요' }
                },
                {
                    id: 'numpad_needed',
                    q: '숫자 키패드(우측 숫자키)가 꼭 필요한가요?',
                    options: { 'yes': '네, 엑셀/데이터 입력이 많아요', 'no': '상관없어요' }
                },
                {
                    id: 'past_complaint',
                    q: '이전에 쓰던 노트북의 가장 큰 불만은 무엇이었나요?',
                    options: { 'slow_speed': '느린 속도', 'heavy_weight': '무거운 무게', 'short_battery': '짧은 배터리', 'dark_screen': '어두운 화면' }
                },
                {
                    id: 'phone_os',
                    q: '현재 사용 중인 스마트폰/태블릿은 무엇인가요?',
                    options: { 'apple': '아이폰/아이패드', 'android': '갤럭시/안드로이드' }
                },
                {
                    id: 'budget_range',
                    q: '생각하시는 최대 예산 범위는 얼마인가요?',
                    options: { 'under_80': '~80만 원', '80_150': '80~150만 원', '150_250': '150~250만 원', 'no_limit': '예산 상관없음' }
                },
                {
                    id: 'usage_period',
                    q: '이 노트북을 몇 년 정도 사용할 계획인가요?',
                    options: { 'short': '1~2년 짧게 (가성비 우선)', 'long': '4년 이상 졸업까지 (성능 우선)' }
                }
            ];

            let currentStep = 0;
            const formData = {};

            const renderStep = (stepIndex) => {
                const question = questions[stepIndex];
                if (!question) return;

                let optionsHTML = '';
                for (const [value, label] of Object.entries(question.options)) {
                    optionsHTML += `
                        <div>
                            <input type="radio" id="${question.id}_${value}" name="${question.id}" value="${value}" class="hidden peer">
                            <label for="${question.id}_${value}" class="block w-full text-left p-4 rounded-lg border border-gray-200 cursor-pointer peer-checked:bg-blue-600 peer-checked:text-white peer-checked:border-blue-600 hover:bg-gray-50 transition-colors">
                                ${label}
                            </label>
                        </div>
                    `;
                }

                const stepHTML = `
                    <div class="question-step animate-fade-in">
                        <p class="text-xl font-semibold text-gray-700 mb-6 text-left">${stepIndex + 1}. ${question.q}</p>
                        <div class="space-y-4">${optionsHTML}</div>
                        <div class="flex mt-8 ${stepIndex === 0 ? 'justify-end' : 'justify-between'}">
                            ${stepIndex > 0 ? '<button class="prev-btn bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-6 rounded-lg transition">이전</button>' : ''}
                            <button class="next-btn bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition">${stepIndex === questions.length - 1 ? '결과 보기' : '다음'}</button>
                        </div>
                    </div>
                `;

                quizArea.innerHTML = stepHTML;
                progressContainer.style.display = 'block';
                progressBar.style.width = `${((stepIndex) / (questions.length - 1)) * 100}%`;

                // Add event listeners for the new buttons
                document.querySelector('.next-btn')?.addEventListener('click', handleNext);
                document.querySelector('.prev-btn')?.addEventListener('click', handlePrev);
            };

            const handleNext = () => {
                const selected = document.querySelector(`input[name="${questions[currentStep].id}"]:checked`);
                if (!selected) {
                    alert('옵션을 선택해주세요!');
                    return;
                }
                formData[questions[currentStep].id] = selected.value;

                if (currentStep < questions.length - 1) {
                    currentStep++;
                    renderStep(currentStep);
                } else {
                    showResult();
                }
            };

            const handlePrev = () => {
                if (currentStep > 0) {
                    currentStep--;
                    renderStep(currentStep);
                }
            };

            const showResult = () => {
                console.log("--- 노트북 추천 설문 결과 ---");
                console.log(JSON.stringify(formData, null, 2));
                document.getElementById('main-content').style.display = 'none';
                resultArea.style.display = 'block';
            };
            
            const startQuiz = () => {
                currentStep = 0;
                Object.keys(formData).forEach(key => delete formData[key]);
                document.getElementById('main-content').style.display = 'block';
                resultArea.style.display = 'none';
                renderStep(0);
            };

            startOverBtn.addEventListener('click', startQuiz);
            
            // Initial render
            startQuiz();

            // Add animation style to head
            const style = document.createElement('style');
            style.innerHTML = `
                @keyframes fadeIn {
                    from { opacity: 0; transform: translateY(15px); }
                    to { opacity: 1; transform: translateY(0); }
                }
                .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
            `;
            document.head.appendChild(style);
        });
    </script>
</body>
</html>
